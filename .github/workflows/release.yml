# Builds the plugin and publishes a GitHub release whenever you push a version tag.
#   1. bump "version" in manifest.json + package.json, add it to versions.json
#   2. git commit -am "2.0.1" && git tag 2.0.1 && git push && git push --tags
# Obsidian's directory and BRAT install/update from these releases.
name: Release plugin
on:
  push:
    tags: ["*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Check tag matches manifest version
        run: |
          V=$(node -p "require('./manifest.json').version")
          [ "$V" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} != manifest $V"; exit 1; }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css --title "${GITHUB_REF_NAME}" --generate-notes
